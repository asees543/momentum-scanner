# India (NSE) configuration. Every threshold the scans use lives here, not in code.
# Values marked (SPEC) come from SPEC.md; (decision) = the user's choice; (assumption) = Claude's default.

market: india
currency: INR

data:
  provider: yfinance               # Yahoo ".NS" tickers, which come split- and bonus-adjusted (SPEC)
  history_years: 5                 # (decision, same as US)
  adjustment: split                # Yahoo .NS prices are adjusted for splits and bonuses
  cache_dir: data/cache/india
  batch_size: 100                  # (assumption)
  batch_pause_seconds: 1.0         # (assumption)
  max_retries: 3                   # (assumption)
  incremental_overlap_bars: 150    # (assumption) covers the 6M window, so a late bonus/split adjustment is caught
  revision_tolerance_pct: 0.5      # (assumption)
  universe_max_age_hours: 20       # (assumption)
  timezone: Asia/Kolkata
  market_close: "15:30"            # NSE close
  close_buffer_minutes: 30         # (assumption) bars dated today are ignored until 16:00 IST
  latest_day_fallback: nse_bhavcopy  # (decision) Yahoo's daily NSE bars arrive a day or more late; take the newest
                                   #   sessions from NSE's own end-of-day file until Yahoo has them (matched Yahoo
                                   #   exactly on 2026-11-12 for all 604 liquid stocks)
  fallback_max_days: 5             # (assumption) how many calendar days back to look for missing sessions

universe:
  exchanges: [NSE]
  series: [EQ]                     # (SPEC) NSE equity list, series EQ only
  exclude_etfs: true               # NSE's equity list has no ETFs; kept for symmetry
  exclude_test_issues: true
  exclude_symbol_patterns: []
  exclude_name_patterns: []

liquidity:
  min_price: 100                   # (SPEC) Rs 100
  min_avg_traded_value: 50000000   # (SPEC) 20-day average turnover >= Rs 5 crore (5 x 1,00,00,000)
  min_adr_pct: 4.0                 # (SPEC) Indian large and mid caps often have lower ADR
  window: 20                       # (SPEC)
  exclude_circuit_locked: true     # (SPEC) exclude stocks stuck at circuit limits for consecutive days
  circuit_lock_min_move_pct: 1.9   # (assumption) NSE's smallest price band is 2%
  circuit_lock_max_range_pct: 0.1  # (assumption) high/low within 0.1% = the stock never traded off the band
  circuit_lock_consecutive_days: 2 # (assumption) "consecutive days" = 2 or more in a row...
  circuit_lock_lookback: 10        # (assumption) ...anywhere in the last 10 sessions

leaders:
  mode: rank                       # (SPEC) prefer relative-strength rank for India
  rank_top_pct: 7                  # (SPEC)
  windows:                         # fixed-mode multiples only matter if mode is switched to fixed
    1m: {lookback: 22, min_multiple: 1.25}    # (assumption: same as US)
    3m: {lookback: 67, min_multiple: 1.50}
    6m: {lookback: 126, min_multiple: 2.50}
  target_count: [25, 75]           # (SPEC)
  sort_by: 3m                      # (assumption)
  flag_day_move_multiple: 1.3      # (decision: flag only) NSE caps daily moves at 20%, so a one-day move of
                                   #   +30% or -23% or more almost always means an unadjusted bonus/split or
                                   #   bad data. Marked with a warning, not excluded.
  min_day_value: 465000000         # (user, 2026-11-21) last session's close x volume above Rs 46.5 crore: the US floor of $5,000,000
                                   #   (the user's C*V/100 > 50,000) converted at 93.3 rupees per dollar (INR=X, 2026-11-20).
                                   #   Same money, not same rank: matching the US share instead (78% of liquid names pass
                                   #   $5M) would give about Rs 5.8 crore. Change the rate here if it drifts

setup:                             # same rules as US (SPEC Stage 3)
  leader_lookback_sessions: 20     # (decision)
  require_liquid_today: true       # (decision)
  sma_trend: 50                    # (SPEC)
  sma_fast: 10                     # (SPEC)
  sma_slow: 20
  high_window: 20                  # (SPEC)
  max_below_high_pct: 15
  higher_lows_bars: 5              # (SPEC)
  tight_min_days: 3                # (SPEC "3 to 5 days")
  tight_max_days: 5
  tight_vs_adr: 1.0                # (SPEC)
  dryup_max_volume_ratio: 0.70     # (SPEC)
  volume_avg_window: 20            # (assumption) the 20 sessions before today
  trigger_bars: 10                 # (decision)

breakout:                          # same rules as US (SPEC Stage 4)
  watchlist_memory_sessions: 5     # (decision)
  min_volume_ratio: 1.5            # (SPEC)
  max_risk_vs_adr: 1.0             # (SPEC)

alerts:
  min_active_ratio: 0.9            # (assumption)
  baseline_first_run: true         # (assumption) the first run sends the full watchlist and records it
  list_wide_breakouts: true        # (decision) name breakouts whose stop is wider than ADR too
  catch_up_max_sessions: 5         # (assumption) if sessions were missed since the last sent alert (outage, late data),
                                   #   also report their breakouts, dated, for up to this many sessions

# Phase 5: point-in-time backtest (python -m scanner.backtest --market india).
backtest:
  benchmark: "^NSEI"          # (SPEC) Nifty 50 index
  cost_pct_per_side: 0.15         # (assumption) STT, exchange and other charges per buy or sell (delivery), in %
  slippage_pct_per_side: 0.10      # (assumption) per buy or sell, in %
  forward_days: [5, 10, 20]        # (SPEC) forward-return horizons, in sessions after entry
  partial_fractions: [0.3333333333, 0.5]   # (SPEC) "sell a third to half..."
  partial_after_days: [3, 5]       # (SPEC) "...after 3-5 days"
  trail_sma: [10, 20]              # (SPEC) "trail the rest below the 10 or 20-day SMA"
  headline_partial_fraction: 0.3333333333  # (assumption) headline variant, fixed BEFORE seeing results;
  headline_partial_after_days: 3   #   all 8 combinations are reported next to it
  headline_trail_sma: 10
  risk_per_trade_pct: 0.5          # (assumption) equity curve: risk 0.5% of equity per trade...
  max_position_pct: 25             # (assumption) ...with no position above 25% of equity...
  max_positions: 10                # (assumption) ...and at most 10 open at once
  min_risk_pct: 1.0                # (assumption) stops closer than 1% count as 1% for R and sizing: a few
                                   #   near-zero stops otherwise dominate average R (found in the first run)
  market_filter_sma: 50            # (assumption) market filter test (user asked 2026-11-15): only take a trade if
                                   #   the benchmark closed above its 50-day SMA the session before entry. Rule and
                                   #   pass mark fixed BEFORE running; no other lengths tried. Reported separately.

# Study set: past trigger touches to look through and practise on (python -m scanner.study -> study/<market>.html).
# These only choose which past examples are shown and how much chart; they are not trading rules.
# The page embeds price history, so study/ is gitignored and never published.
study:
  winners: 60                      # (assumption) biggest winners: top N trigger touches by trade return
  failures: 60                     # (assumption) random triggers that failed to confirm by the close
  confirmed_losers: 40             # (assumption) random confirmed breakouts that still lost money
  random: 100                      # (assumption) random sample of ALL trigger touches: the realistic mix
  bars_before: 130                 # (assumption) sessions charted before the trigger day (6M window + base)
  bars_after: 60                   # (assumption) sessions charted from the trigger day on
  min_bars_after: 20               # (assumption) skip triggers with fewer sessions of data after them
  winner_spacing: 20               # (assumption) biggest winners: one card per symbol within 20 sessions
  seed: 7                          # (assumption) fixed, so the same cards come out until the data changes

# Jack Corsellis's screener (filters read off the user's screenshot of it, 2026-11-20). A name "passes both
# screens" when it is on our leaders list, watchlist or breakouts AND passes these. Shown as its own section
# on the dashboard and in the alert message.
jack:
  ema_fast: 21                     # (user screenshot) price above the 21-day EMA
  sma_mid: 50                      # (user screenshot) price above the 50-day SMA
  sma_long: 200                    # (user screenshot) price above the 200-day SMA
  adr_window: 20                   # (user screenshot) 20-day ADR %
  min_adr_pct: 4.0                 # (user screenshot) ADR greater than 4%
  adv_window: 50                   # (user screenshot) 50-day average turnover
  min_avg_traded_value: 1200000000 # (assumption) Rs 120 crore. The screenshot's 250M is in dollars; at about Rs 88 per
                                   #   dollar that is Rs 2,200 crore, which no name in our liquid India list reaches.
                                   #   Instead the same RANK: 250M is the top 10.5% of the liquid US names (2026-11-13
                                   #   data), and the top 10.5% of the liquid India names starts at about Rs 119 crore

# Trigger Bar scan (user asked 2026-11-21: "tell when a trigger bar appears so I can be ready for a breakout next day").
# Rules from the Blueprint Trading Course (Jack Corsellis), pages 36-37. A bar qualifies when ALL hold on the latest
# session: liquid (the Stage 1 price and value floors, not circuit-stuck), ADR >= min_adr_pct, close above the 50 and
# 200-day SMAs, the bar's range <= max_range_vs_adr x ADR, a key MA (10 EMA / 21 EMA / 50 SMA / 200 SMA) inside the bar
# or within near_ma_adr_mult x ADR of it, and the stop (below the bar low) no wider than 1 ADR. Ranked by how many of 6
# course bonuses it also has.
trigger_bar:
  min_adr_pct: 1.5                 # (assumption) the course's example setups have ADRs of 1.6% to 6.9%, so no 5% floor here
  max_range_vs_adr: 0.67           # (course) bar range 1/2 to 2/3 of the 20-day ADR in the better cases; 2/3 as the cap
  near_ma_adr_mult: 0.5            # (assumption) "on or in proximity" of a key MA: inside the bar, or within half an ADR
  ema_fast: 10                     # (course) key moving averages: 10-day EMA,
  ema_mid: 21                      # (course) 21-day EMA,
  sma_mid: 50                      # (course) 50-day SMA ("preferably above": required here, assumption),
  sma_long: 200                    # (course) and 200-day SMA (required)
  tightest_lookback: 10            # (assumption) bonus: tightest range of the previous 10 bars ("tightest within prior weeks")
  volume_window: 30                # (course) bonus: volume vs its 30-day average
  low_volume_ratio: 1.0            # (assumption) "low relative volume" = below its average
  strong_close: 0.5                # (assumption) bonus: close in the upper half of the bar ("the stronger it closes the better")
  half_adr_mult: 0.5               # (course) bonus: range <= 1/2 ADR, the tight end of 1/2 to 2/3
  min_confluence: 2                # (assumption) bonus: two or more key MAs near the bar
  stop_buffer: 0.05              # (course: $0.01) stop = bar low minus this
  high_window: 252                 # (assumption) context column only: % below the 52-week high (252 sessions)
  message_max: 20                  # (assumption) names in the alert message, best first; the rest are on the dashboard
  max_listed: 100                  # (assumption) names kept on the dashboard, best first (keeps the daily data file small)

# Sector and industry strength (user asked 2026-11-21: "knowing what sectors are in strength for both countries").
# Each liquid (Stage 1) name is mapped to Yahoo's sector and industry (reference/sectors/<market>.csv, filled by
# `python -m scanner.sectors`). A group is ranked on three equally weighted measures among its liquid names: the share
# that are leaders today, the share above their 50-day average, and the median 3-month return.
sectors:
  min_names_sector: 5              # (assumption) a sector needs at least 5 liquid names to be ranked
  min_names_industry: 5            # (assumption) same for an industry (Yahoo has about 140 industries)
  change_sessions: 5               # (assumption) "money flowing": share above the 50-day average now vs 5 sessions ago
  sma: 50                          # (assumption) "above its 50-day average" (the same average the setup rules use)
  message_sectors: 5               # (assumption) sectors listed in the alert message, strongest first
  message_industries: 8            # (assumption) industries listed in the alert message
  dashboard_industries: 25         # (assumption) industries kept on the dashboard
  max_new_per_run: 150             # (assumption) unmapped names looked up per daily run (keeps the run short)
  stale_days: 180                  # (assumption) look a classified name up again after about 6 months
  retry_days: 30                   # (assumption) retry a name Yahoo had no sector for after 30 days
