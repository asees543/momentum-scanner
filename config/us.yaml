# US market configuration. Every threshold the scans use lives here, not in code.
# Values marked (SPEC) come from SPEC.md; values marked (assumption) are Claude's defaults - tune freely.

market: us
currency: USD

data:
  provider: yfinance
  history_years: 5                 # (decision) first download depth; also feeds the Phase 5 backtest
  adjustment: split                # (decision) split-adjusted only, no dividend adjustment
  cache_dir: data/cache/us
  batch_size: 100                  # (assumption) tickers per yfinance request
  batch_pause_seconds: 1.0         # (assumption) politeness delay between batches
  max_retries: 3                   # (assumption) per batch, with exponential backoff
  incremental_overlap_bars: 150    # (assumption) bars re-downloaded and compared on each update. Covers the
                                   # 126-bar 6M window, so a split Yahoo records LATE still triggers a re-download.
  revision_tolerance_pct: 0.5      # (assumption) overlap close mismatch above this => re-download full history
  universe_max_age_hours: 20       # (assumption) re-fetch the symbol list when older than this
  timezone: America/New_York
  market_close: "16:00"
  close_buffer_minutes: 30         # (assumption) bars dated today are ignored until close + buffer

universe:
  exchanges: [NASDAQ, NYSE, NYSE_AMERICAN]   # (SPEC) NYSE Arca, Cboe BZX, IEX excluded
  exclude_etfs: true                          # (SPEC)
  exclude_test_issues: true                   # (SPEC)
  # (assumption) Regexes on the Nasdaq Trader symbol: '$' marks a preferred,
  # '.U' / '.W' / '.WS' / '.R' / '.RT' / '.WI' mark units, warrants, rights, when-issued.
  # Class shares such as BRK.B or AGM.A are kept.
  exclude_symbol_patterns:
    - '\$'
    - '\.(?:U|W|WS|R|RT|WI)$'
  # (assumption) Case-insensitive regexes on the security name for non-common-stock issues.
  # ADRs ("American Depositary Shares") are KEPT; depositary shares of preferreds are caught by "preferred".
  exclude_name_patterns:
    - '\bwarrants?\b'
    - '(?<!common )(?<!class a )\bunits?\b\.?(?:\s*,\s*each|\s*$)'   # SPAC units ("... - Units", "Units, each consisting of"); MLP/LLC common units kept
    - '\brights?\b(?!\s+to\s+receive)'   # ADR names say "the right to receive"; keep those
    - '\bpreferred\s+(?:stock|shares?|units?|securities|class|series)\b'   # not "Preferred Bank"
    - '\bpreference shares?\b'
    - '\bnotes?\b'
    - '\bdebentures?\b'
    - '\bperpetual\b'
    - '\bpercent\b'
    - '%'
    - '\bfixed[- ]to[- ]floating\b'
    - '\bsubordinated\b'
    - '\bETN\b'

liquidity:
  min_price: 1.0                   # (SPEC) many people use a higher floor
  min_avg_traded_value: 3000000    # (SPEC) 20-day average of close x volume, in USD ("dollar volume")
  min_adr_pct: 5.0                 # (SPEC)
  window: 20                       # (SPEC) days for both averages above
  exclude_circuit_locked: false    # US exchanges have no daily price bands (India rule, see india.yaml)

leaders:
  mode: fixed                      # (SPEC) fixed | rank
  rank_top_pct: 7                  # (SPEC) rank mode keeps the top 7% by return
  windows:
    1m: {lookback: 22, min_multiple: 1.25}    # (SPEC) close >= 1.25 x close 22 bars ago
    3m: {lookback: 67, min_multiple: 1.50}    # (SPEC)
    6m: {lookback: 126, min_multiple: 2.50}   # (SPEC)
  target_count: [25, 75]           # (SPEC) CLI warns when a scan lands outside this range
  sort_by: 3m                      # (assumption) table order: scans passed, then this window's return
  flag_day_move_multiple: 3.0      # (assumption) mark names whose window holds a one-day move >= 3x (or <= 1/3x):
                                   # a real squeeze or an un-adjusted reverse split - check the chart
  min_day_value: 5000000           # (user, 2026-11-21) the per-window lists (1M / 3M / 6M, each ranked by its gain) only
                                   #   include names whose last session's close x volume is above this: the user's scanner
                                   #   formula "C*V/100 > 50,000" is the same as C*V > 5,000,000. One day, not an average

# Stage 3: orderly consolidation. A leader qualifies on day t when ALL of these hold.
setup:
  leader_lookback_sessions: 20   # (decision) leader (and liquid) on any of the last 20 sessions
  require_liquid_today: true     # (decision) Stage 1 (price, avg $vol, ADR >= 5%) must also pass on the day
                                 #   itself; drops acquisition-pinned names whose ADR collapsed (SLN, BRZE)
  sma_trend: 50                  # (SPEC) close > 50-day SMA
  sma_fast: 10                   # (SPEC) 10-day SMA > 20-day SMA
  sma_slow: 20
  high_window: 20                # (SPEC) close within 15% of the 20-day high (highs, incl. today)
  max_below_high_pct: 15
  higher_lows_bars: 5            # (SPEC) lowest low of last 5 bars > lowest low of the 5 before
  tight_min_days: 3              # (SPEC "3 to 5 days", assumption on reading) average daily range over
  tight_max_days: 5              #   the last 3, 4 OR 5 days < tight_vs_adr x ADR%
  tight_vs_adr: 1.0              # (SPEC) "< ADR"
  dryup_max_volume_ratio: 0.70   # (SPEC) today's volume <= 70% of the average volume
  volume_avg_window: 20          # (assumption) that average covers the 20 sessions BEFORE today
  trigger_bars: 10               # (decision) trigger_price = highest high of the last 10 bars

# Stage 4: breakout on a name whose setup qualified recently.
breakout:
  watchlist_memory_sessions: 5   # (decision) setup qualified on one of the 5 sessions before the breakout
  min_volume_ratio: 1.5          # (SPEC) volume >= 1.5 x average volume of the 20 sessions before
  max_risk_vs_adr: 1.0           # (SPEC) reject if (close - day low) / close > ADR% (ADR as of the day before)

# Phase 3: alerts (Telegram) and state diffing.
alerts:
  min_active_ratio: 0.9          # (assumption) if fewer than 90% as many symbols have a bar as on the last sent
                                 #   run (e.g. a rate-limited download), send a warning instead of alerts and keep
                                 #   the old state, so missing names don't come back as "new" the next day
  baseline_first_run: true       # (assumption) with no state file yet, record today's watchlist as the baseline
                                 #   and alert only breakouts, instead of listing every watchlist name at once
  list_wide_breakouts: true      # (decision) also name breakouts whose stop is wider than 1 ADR, in their own
                                 #   section. SPEC says reject them; they are listed (marked) so you decide.
  catch_up_max_sessions: 5         # (assumption) if sessions were missed since the last sent alert (outage, late data),
                                   #   also report their breakouts, dated, for up to this many sessions

# Phase 5: point-in-time backtest (python -m scanner.backtest --market us).
backtest:
  benchmark: "SPY"            # (SPEC) S&P 500 ETF
  cost_pct_per_side: 0.05         # (assumption) commissions and fees per buy or sell, in %
  slippage_pct_per_side: 0.10      # (assumption) per buy or sell, in %
  forward_days: [5, 10, 20]        # (SPEC) forward-return horizons, in sessions after entry
  partial_fractions: [0.3333333333, 0.5]   # (SPEC) "sell a third to half..."
  partial_after_days: [3, 5]       # (SPEC) "...after 3-5 days"
  trail_sma: [10, 20]              # (SPEC) "trail the rest below the 10 or 20-day SMA"
  headline_partial_fraction: 0.3333333333  # (assumption) headline variant, fixed BEFORE seeing results;
  headline_partial_after_days: 3   #   all 8 combinations are reported next to it
  headline_trail_sma: 10
  risk_per_trade_pct: 0.5          # (assumption) equity curve: risk 0.5% of equity per trade...
  max_position_pct: 25             # (assumption) ...with no position above 25% of equity...
  max_positions: 10                # (assumption) ...and at most 10 open at once
  min_risk_pct: 1.0                # (assumption) stops closer than 1% count as 1% for R and sizing: a few
                                   #   near-zero stops otherwise dominate average R (found in the first run)
  market_filter_sma: 50            # (assumption) market filter test (user asked 2026-11-15): only take a trade if
                                   #   the benchmark closed above its 50-day SMA the session before entry. Rule and
                                   #   pass mark fixed BEFORE running; no other lengths tried. Reported separately.

# Study set: past trigger touches to look through and practise on (python -m scanner.study -> study/<market>.html).
# These only choose which past examples are shown and how much chart; they are not trading rules.
# The page embeds price history, so study/ is gitignored and never published.
study:
  winners: 60                      # (assumption) biggest winners: top N trigger touches by trade return
  failures: 60                     # (assumption) random triggers that failed to confirm by the close
  confirmed_losers: 40             # (assumption) random confirmed breakouts that still lost money
  random: 100                      # (assumption) random sample of ALL trigger touches: the realistic mix
  bars_before: 130                 # (assumption) sessions charted before the trigger day (6M window + base)
  bars_after: 60                   # (assumption) sessions charted from the trigger day on
  min_bars_after: 20               # (assumption) skip triggers with fewer sessions of data after them
  winner_spacing: 20               # (assumption) biggest winners: one card per symbol within 20 sessions
  seed: 7                          # (assumption) fixed, so the same cards come out until the data changes

# Jack Corsellis's screener (filters read off the user's screenshot of it, 2026-11-20). A name "passes both
# screens" when it is on our leaders list, watchlist or breakouts AND passes these. Shown as its own section
# on the dashboard and in the alert message.
jack:
  ema_fast: 21                     # (user screenshot) price above the 21-day EMA
  sma_mid: 50                      # (user screenshot) price above the 50-day SMA
  sma_long: 200                    # (user screenshot) price above the 200-day SMA
  adr_window: 20                   # (user screenshot) 20-day ADR %
  min_adr_pct: 4.0                 # (user screenshot) ADR greater than 4%
  adv_window: 50                   # (user screenshot) 50-day average dollar volume
  min_avg_traded_value: 250000000  # (user screenshot, read as USD) greater than 250M. Only about the top 10% of
                                   #   the liquid US universe trades that much

# Trigger Bar scan (user asked 2026-11-21: "tell when a trigger bar appears so I can be ready for a breakout next day").
# Rules from the Blueprint Trading Course (Jack Corsellis), pages 36-37. A bar qualifies when ALL hold on the latest
# session: liquid (the Stage 1 price and value floors, not circuit-stuck), ADR >= min_adr_pct, close above the 50 and
# 200-day SMAs, the bar's range <= max_range_vs_adr x ADR, a key MA (10 EMA / 21 EMA / 50 SMA / 200 SMA) inside the bar
# or within near_ma_adr_mult x ADR of it, and the stop (below the bar low) no wider than 1 ADR. Ranked by how many of 6
# course bonuses it also has.
trigger_bar:
  min_adr_pct: 1.5                 # (assumption) the course's example setups have ADRs of 1.6% to 6.9%, so no 5% floor here
  max_range_vs_adr: 0.67           # (course) bar range 1/2 to 2/3 of the 20-day ADR in the better cases; 2/3 as the cap
  near_ma_adr_mult: 0.5            # (assumption) "on or in proximity" of a key MA: inside the bar, or within half an ADR
  ema_fast: 10                     # (course) key moving averages: 10-day EMA,
  ema_mid: 21                      # (course) 21-day EMA,
  sma_mid: 50                      # (course) 50-day SMA ("preferably above": required here, assumption),
  sma_long: 200                    # (course) and 200-day SMA (required)
  tightest_lookback: 10            # (assumption) bonus: tightest range of the previous 10 bars ("tightest within prior weeks")
  volume_window: 30                # (course) bonus: volume vs its 30-day average
  low_volume_ratio: 1.0            # (assumption) "low relative volume" = below its average
  strong_close: 0.5                # (assumption) bonus: close in the upper half of the bar ("the stronger it closes the better")
  half_adr_mult: 0.5               # (course) bonus: range <= 1/2 ADR, the tight end of 1/2 to 2/3
  min_confluence: 2                # (assumption) bonus: two or more key MAs near the bar
  stop_buffer: 0.01              # (course: $0.01) stop = bar low minus this
  high_window: 252                 # (assumption) context column only: % below the 52-week high (252 sessions)
  message_max: 20                  # (assumption) names in the alert message, best first; the rest are on the dashboard
  max_listed: 100                  # (assumption) names kept on the dashboard, best first (keeps the daily data file small)
