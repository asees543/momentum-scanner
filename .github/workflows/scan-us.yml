name: scan-us

on:
  schedule:
    # 22:00 UTC Mon-Fri = 17:00 EST / 18:00 EDT, after the 16:00 New York close in both DST states.
    # Market holidays need no special case: no new bar -> the run skips silently.
    - cron: "0 22 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the alerts in the log instead of sending them (state is not saved)"
        type: boolean
        default: true

permissions:
  contents: write # commit state/us.json

concurrency:
  group: scan-us
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      # Prices live in the Actions cache (80 MB, too big to commit daily). Each run saves a new entry
      # and restores the newest one; if it was evicted, the scan re-downloads 5 years (~6 min).
      - name: Restore price cache
        uses: actions/cache/restore@v6
        with:
          path: data/cache/us
          key: prices-us-${{ github.run_id }}
          restore-keys: prices-us-

      - name: Install dependencies
        run: uv sync --frozen

      - name: Scan and alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          COLUMNS: "160"
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            uv run python -m scanner.run --market us --alert --dry-run
          else
            uv run python -m scanner.run --market us --alert
          fi

      - name: Save price cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: data/cache/us
          key: prices-us-${{ github.run_id }}

      # state/us.json records what was already sent. Committing it keeps alerts from repeating and
      # the daily commit keeps GitHub from disabling the schedule after 60 days without activity.
      - name: Commit alert state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/us.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "state unchanged"
            exit 0
          fi
          git commit -m "Update US alert state for $(jq -r .as_of state/us.json)"
          for attempt in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1
