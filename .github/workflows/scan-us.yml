name: scan-us

on:
  schedule:
    # BACKUP ONLY. The primary trigger is cron-job.org calling workflow_dispatch at 17:00 New York time,
    # which usually starts within seconds (docs/external-scheduler.md). Whichever run comes second skips silently.
    # 22:23 UTC Mon-Fri = 17:23 EST / 18:23 EDT, after the 16:00 New York close in both DST states
    # (SPEC: "for example 22:00 UTC"). Odd minute on purpose: GitHub delays scheduled runs most at the
    # top of the hour and other round times (the 22:00 run on 2026-11-13 started 4 hours late).
    # Market holidays need no special case: no new bar -> the run skips silently.
    - cron: "23 22 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the alerts in the log instead of sending them (state is not saved)"
        type: boolean
        default: true
      full_watchlist:
        description: "Instead: send the whole current watchlist to Telegram now (ignores dry run; state unchanged)"
        type: boolean
        default: false

permissions:
  contents: write # commit state/us.json

concurrency:
  group: scan-us
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes only full version tags (there is no moving "v10" tag).
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      # Prices live in the Actions cache (80 MB, too big to commit daily). Each run saves a new entry
      # and restores the newest one; if it was evicted, the scan re-downloads 5 years (~6 min).
      - name: Restore price cache
        uses: actions/cache/restore@v6
        with:
          path: data/cache/us
          key: prices-us-${{ github.run_id }}
          restore-keys: prices-us-

      - name: Install dependencies
        run: uv sync --frozen

      - name: Scan and alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          FULL_WATCHLIST: ${{ github.event_name == 'workflow_dispatch' && inputs.full_watchlist }}
          COLUMNS: "160"
        run: |
          if [ "$FULL_WATCHLIST" = "true" ]; then
            uv run python -m scanner.run --market us --scan watchlist --send-watchlist
          elif [ "$DRY_RUN" = "true" ]; then
            uv run python -m scanner.run --market us --alert --dry-run
          else
            uv run python -m scanner.run --market us --alert
          fi

      - name: Save price cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: data/cache/us
          key: prices-us-${{ github.run_id }}

      # state/us.json records what was already sent. Committing it keeps alerts from repeating and
      # the daily commit keeps GitHub from disabling the schedule after 60 days without activity.
      - name: Commit alert state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/us.json site/data/us.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "state unchanged"
            exit 0
          fi
          git commit -m "Update US alert state for $(jq -r .as_of state/us.json)"
          for attempt in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1

  # Rebuild the dashboard (GitHub Pages) from the latest main, which now has this market's fresh
  # site/data/us.json and the other market's last one. Real runs only.
  publish:
    needs: scan
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run && !inputs.full_watchlist)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run python -m scanner.dashboard --out _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
